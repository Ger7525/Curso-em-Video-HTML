<!DOCTYPE html>
<html lang="pt-BR">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Desafio Grid</title>
                    <style>
                         .container{
                               margin: 0 auto;
                               max-width: 90%;         
                               display: grid; 
                               grid-template: repeat(11, 50px) / 1fr 2fr 1fr;  
                               gap: 5px;  
                               text-align: center;
                               border: 1px solid black;
                               
                                   
                         } 
                         .topo{
                              background-color: grey;
                              grid-area: 1/1/3/span 3;
                              align-items: center;
                              align-content: center;
                              border: 1px solid black;
                         } 
                         .menu{
                                background-color: darkgray; 
                                grid-area: 3/1/3/span 3;
                                align-items: center;
                                align-content: center;
                                border: 1px solid black;       
                         } 
                         .principal{
                                background-color: rgba(169, 169, 169, 0.426); 
                                grid-area: 4/1/span 7/span 2;
                                align-items: center;
                                align-content: center;
                                border: 1px solid black;           
                         }
                         .secundario{
                                background-color: rgba(169, 169, 169, 0.426); 
                                grid-area: 4/3/span 7/3;
                                align-items: center;
                                align-content: center; 
                                border: 1px solid black;              
                         } 
                         .rodape{
                               background-color: rgba(169, 169, 169, 0.426); 
                               grid-area:11/ 1/ span 3/ span 3;
                               align-items: center;
                               align-content: center;
                               border: 1px solid black;           
                         }           
                    </style>
</head>
<body>
        <div class="container">
             <div class="topo">Topo</div>
             <div class="menu">Menu</div>
             <div class="principal">Principal</div>
             <div class="secundario">Secundario</div>
             <div class="rodape">Rodapé</div>       
        </div>            
                    
</body>
</html>

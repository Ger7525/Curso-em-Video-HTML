<!DOCTYPE html>
<html lang="pt-BR">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Flex-box</title>
                    <style>
                     div.container{
                                        background-color: lightcoral;
                                        display: flex;
                                        flex-flow: row wrap;
                                                           
                                        

                     }
                     div.item{
                                        background-color: lightskyblue;
                                        border: 1px solid black;
                                        padding: 20px;
                                        text-align: center;
                                        
                                        
                     }
                    </style>
</head>
<body>
                    <div class="container">
                                        <div class="item" style="order: 2;">A</div>
                                        <div class="item" style="order: 4;">B</div>
                                        <div class="item" style="order: 6;">C</div>
                                        <div class="item" style="order: 7;">D</div>
                                        <div class="item" style="order: 5;">E</div>
                                        <div class="item" style="order: 3;">F</div>
                                        <div class="item" style="order: 1;">G</div>
                                        
                    </div>
                    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Grid Itens</title>
                    <style>
                         .container{
                              display: grid;
                              grid-template-rows: repeat(3, 100px);
                              grid-template-columns: repeat(4, 1fr); 
                              gap: 10px;         
                         }
                         .caixa-1{
                              background-color: red;  
                              grid-column:1/5;
                              grid-row:1/2;       
                         }  
                         .caixa-2{
                             background-color: black; 
                             color: white; 
                            grid-row:2 /span 2;
                            grid-column:1/ span 2  ;
                                       
                         } 
                         .caixa-3{
                              background-color:aquamarine; 
                              grid-area:2/3/4/5 ; 
                                   
                         }            
                    </style>
</head>
<body>
       <div class="container">
                           <div class="caixa-1">Caixa 01</div>
                           <div class="caixa-2">Caixa 02</div>
                           <div class="caixa-3">Caixa 03</div>
       </div>            
                    
</body>
</html>
